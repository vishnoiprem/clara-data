# Single-node Trino: coordinator and worker in one process.
# Enough for development and for genuinely small production installs; scale out
# by setting node-scheduler.include-coordinator=false and adding workers.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Memory. Sized for a laptop; raise both on real hardware.
query.max-memory=2GB
query.max-memory-per-node=1GB

# Spill to disk rather than failing a large join. On commodity hardware,
# finishing slowly beats an out-of-memory error.
spill-enabled=true
spiller-spill-path=/tmp/trino-spill

# Dynamic filtering is the single biggest win for star-schema joins over
# partitioned Iceberg tables.
enable-dynamic-filtering=true
