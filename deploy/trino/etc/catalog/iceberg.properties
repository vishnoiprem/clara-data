# Iceberg over an S3-compatible object store, via the open REST catalog.
#
# These four lines are why Clara is portable: point s3.endpoint at MinIO, AWS
# S3, Tencent COS or Alibaba OSS and nothing else changes.

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-catalog:8181/catalog
iceberg.rest-catalog.warehouse=clara-lakehouse
iceberg.file-format=PARQUET

# zstd compresses far better than snappy on analytical data, which matters most
# when storage is the bill you cannot auto-suspend.
iceberg.compression-codec=ZSTD

# Merge-on-read keeps upserts affordable: a matched row writes a delete file
# instead of rewriting the whole data file.
iceberg.delete-mode=merge-on-read
iceberg.update-mode=merge-on-read

# Object storage access.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=clara
s3.aws-secret-key=clara-dev-secret
