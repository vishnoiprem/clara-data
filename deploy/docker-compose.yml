# Clara — full local stack.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Brings up the production shape of the platform on one machine: object storage,
# an Iceberg REST catalog, Trino, Postgres and the Clara control plane. Nothing
# here is cloud-specific — swap MinIO's endpoint for S3/COS/OSS and the same
# stack runs on any provider.
#
# For a quick look at Clara you do not need this at all: `clara init && clara
# serve` runs the whole platform single-node with no containers.

name: clara

services:

  # ─────────────────────────────────────────────── object storage (S3 API)
  # Stands in for S3 / Tencent COS / Alibaba OSS / R2. Iceberg data and
  # metadata live here, in open Parquet — never in a Clara-proprietary store.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${CLARA_STORAGE_ACCESS_KEY:-clara}
      MINIO_ROOT_PASSWORD: ${CLARA_STORAGE_SECRET_KEY:-clara-dev-secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket on first boot, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set clara http://minio:9000
        ${CLARA_STORAGE_ACCESS_KEY:-clara} ${CLARA_STORAGE_SECRET_KEY:-clara-dev-secret} &&
      mc mb --ignore-existing clara/${CLARA_STORAGE_BUCKET:-clara-lakehouse} &&
      echo 'bucket ready'
      "

  # ────────────────────────────────────────────── metadata / catalog store
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clara
      POSTGRES_PASSWORD: clara
      POSTGRES_DB: clara
      POSTGRES_MULTIPLE_DATABASES: iceberg
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clara"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ───────────────────────────────────────────── Iceberg REST catalog
  # Lakekeeper speaks the open Iceberg REST protocol, so Trino, Spark, Flink
  # and DuckDB can all read the same tables. This is the anti-lock-in piece:
  # the catalog is a standard, not a vendor feature.
  iceberg-catalog:
    image: quay.io/lakekeeper/catalog:v0.9.2
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://clara:clara@postgres:5432/iceberg
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://clara:clara@postgres:5432/iceberg
      LAKEKEEPER__PG_ENCRYPTION_KEY: clara-local-development-key
      LAKEKEEPER__AUTHZ_BACKEND: allow-all
      RUST_LOG: info
    command: ["serve"]
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ─────────────────────────────────────────────────────── query engine
  trino:
    image: trinodb/trino:476
    depends_on:
      iceberg-catalog:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ──────────────────────────────────────────── Clara control plane + console
  clara:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8080"
    environment:
      CLARA_ENV: dev
      CLARA_LOG_LEVEL: INFO
      CLARA_API_HOST: 0.0.0.0
      CLARA_API_PORT: 8080
      # Local stack only: leave auth on anywhere real.
      CLARA_AUTH_DISABLED: "true"

      CLARA_PROVIDER: generic
      CLARA_STORAGE_BUCKET: ${CLARA_STORAGE_BUCKET:-clara-lakehouse}
      CLARA_STORAGE_ENDPOINT: http://minio:9000
      CLARA_STORAGE_ACCESS_KEY: ${CLARA_STORAGE_ACCESS_KEY:-clara}
      CLARA_STORAGE_SECRET_KEY: ${CLARA_STORAGE_SECRET_KEY:-clara-dev-secret}
      CLARA_STORAGE_PATH_STYLE: "true"
      CLARA_STORAGE_REGION: us-east-1

      CLARA_CATALOG_KIND: rest
      CLARA_CATALOG_URI: http://iceberg-catalog:8181/catalog
      CLARA_CATALOG_WAREHOUSE: s3://${CLARA_STORAGE_BUCKET:-clara-lakehouse}/warehouse

      CLARA_TRINO_HOST: trino
      CLARA_TRINO_PORT: "8080"
      CLARA_TRINO_CATALOG: iceberg

      CLARA_PLAN: ${CLARA_PLAN:-team}
      CLARA_RATE_CARD: default
    volumes:
      # Mount your project so clara.yaml edits in the console land on the host.
      - ../:/workspace
    working_dir: /workspace
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  minio-data:
  postgres-data:
